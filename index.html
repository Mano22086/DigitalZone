<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DigitalZone | متجر رقمي</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#08060d;--panel:#130d1d;--panel2:#1b1028;--line:#342044;--p:#a855f7;--p2:#d8b4fe;--pink:#f0abfc;--txt:#faf7ff;--muted:#b9a8c8;--ok:#4ade80;--bad:#fb7185}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#34164e 0,#08060d 48%);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.wrap{width:min(1180px,92%);margin:auto}
header{position:sticky;top:0;z-index:20;background:#09060deb;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.top{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:950}.brand img{width:42px;height:42px;border-radius:12px;object-fit:cover}.brand span{color:var(--pink)}.actions{display:flex;gap:8px}.btn{padding:11px 15px;border-radius:12px;background:linear-gradient(135deg,var(--p),#7c3aed);color:#fff;font-weight:850}.btn.alt{background:#1b1226;border:1px solid var(--line)}
.hero{padding:34px 0 18px;display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center}.pill{display:inline-block;padding:7px 11px;border:1px solid #6d3c91;border-radius:999px;color:var(--p2);font-size:12px}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.15;margin:12px 0}.gradient{background:linear-gradient(90deg,#d8b4fe,#f0abfc);color:transparent;background-clip:text}.hero p{color:var(--muted);line-height:1.9;max-width:650px}.hero-art{border:1px solid #54306e;border-radius:28px;min-height:290px;overflow:hidden;background:radial-gradient(circle at 20% 30%,#64268b66,transparent 35%),radial-gradient(circle at 80% 70%,#a855f733,transparent 40%),#100918;padding:20px;display:grid;place-items:center;box-shadow:0 25px 80px #6d28d922}.orbit{width:220px;height:220px;border:1px solid #a855f755;border-radius:50%;display:grid;place-items:center;position:relative;animation:spin 20s linear infinite}.orbit:before,.orbit:after{content:"";position:absolute;border-radius:50%;background:var(--p);box-shadow:0 0 30px #a855f7}.orbit:before{width:14px;height:14px;top:14px}.orbit:after{width:9px;height:9px;bottom:35px;right:18px}.core{width:100px;height:100px;border-radius:30px;background:linear-gradient(145deg,#b66cff,#5b21b6);display:grid;place-items:center;font-size:34px;font-weight:950;box-shadow:0 0 55px #a855f766;animation:spin 20s linear infinite reverse}@keyframes spin{to{transform:rotate(360deg)}}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.search{flex:1;min-width:230px;background:#100a17;border:1px solid var(--line);border-radius:13px;padding:12px;color:var(--txt);outline:none}.catbar{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.cat{white-space:nowrap;padding:9px 13px;border-radius:999px;background:#130d1d;border:1px solid var(--line);color:#d7c7e7}.cat.active{background:#6d28d9;border-color:#9d5cf5;color:#fff}
.section{padding:16px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:14px 0}.section-head h2{margin:0;font-size:22px}.count{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{background:linear-gradient(160deg,#191024,#0e0915);border:1px solid var(--line);border-radius:18px;padding:12px;overflow:hidden}.art{height:155px;border-radius:13px;overflow:hidden;background:#171022}.art img{width:100%;height:100%;object-fit:cover}.card h3{font-size:16px;margin:11px 3px 5px}.meta{font-size:12px;color:#d2b8e8}.desc{font-size:12px;color:var(--muted);line-height:1.7;min-height:40px}.price{font-size:21px;font-weight:950;margin:10px 3px}.card .row{display:flex;gap:7px}.card .row button{flex:1}.empty{padding:40px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:15px;z-index:50}.modal.hidden{display:none}.panel{width:min(560px,100%);max-height:92vh;overflow:auto;background:#120b19;border:1px solid #4a2860;border-radius:20px;padding:18px;box-shadow:0 30px 100px #000}.panel h2{margin-top:0}.field{margin:11px 0}.field label{display:block;color:#ddcce9;font-size:13px;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;background:#0b0710;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px}.field textarea{min-height:90px;resize:vertical}.msg{padding:10px;border-radius:10px;background:#21142d;margin:10px 0}.msg.err{border:1px solid #7f1d32}.msg.ok{border:1px solid #166534}.orders .order{border-bottom:1px solid var(--line);padding:12px 0}.muted{color:var(--muted)}footer{border-top:1px solid var(--line);margin-top:30px;padding:22px 0;color:var(--muted);font-size:12px}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero-art{min-height:220px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.art{height:120px}.card{padding:9px}.card h3{font-size:14px}.price{font-size:18px}.actions .btn{padding:9px 10px;font-size:12px}}
@media(max-width:390px){.grid{grid-template-columns:1fr}.brand{font-size:18px}.hero h1{font-size:34px}}
</style>
</head>
<body>
<header><div class="wrap top"><div class="brand"><img src="digitalzone-mark.jpg" alt="DigitalZone"><div>Digital<span>Zone</span></div></div><div class="actions"><button class="btn alt" id="ordersBtn">طلباتي</button><button class="btn" id="authBtn">دخول</button></div></div></header>
<main class="wrap">
<section class="hero"><div><span class="pill">✦ متجر DigitalZone الرقمي</span><h1>منتجاتك الرقمية<br><span class="gradient">مرتبة وواضحة.</span></h1><p>تصفح الاشتراكات والألعاب والأدوات الرقمية في أقسام منظمة. اختار المنتج، راجع التفاصيل، وسجل طلبك بسهولة.</p><div class="tools"><button class="btn" id="shopBtn">تصفح المنتجات</button></div></div><div class="hero-art"><div class="orbit"><div class="core">DZ</div></div></div></section>
<section class="section" id="products"><div class="tools"><input id="search" class="search" placeholder="ابحث باسم المنتج أو القسم..."></div><div class="catbar" id="cats"></div><div id="catalog"></div></section>
</main>
<div class="modal hidden" id="authModal"><div class="panel"><h2 id="authTitle">تسجيل الدخول</h2><div id="authMsg"></div><div class="field" id="nameWrap" style="display:none"><label>الاسم</label><input id="fullName"></div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password"></div><div class="row"><button class="btn" id="authSubmit">دخول</button><button class="btn alt" id="googleBtn">Google</button></div><p><button class="btn alt" id="authToggle">إنشاء حساب</button></p><button class="btn alt" id="authClose">إغلاق</button></div></div>
<div class="modal hidden" id="checkoutModal"><div class="panel"><h2>إتمام الطلب</h2><div id="checkoutMsg"></div><div id="checkoutProduct"></div><div class="field"><label>اسمك</label><input id="customerName"></div><div class="field"><label>رقم الموبايل</label><input id="customerPhone"></div><div class="field"><label>رقم الموبايل اللي تم التحويل منه</label><input id="senderPhone"></div><div class="field"><label>طريقة استلام الخدمة</label><select id="deliveryMethod"><option value="whatsapp">واتساب</option><option value="email">البريد الإلكتروني</option></select></div><div class="field"><label>بيانات الاستلام</label><input id="deliveryDestination"></div><div class="field"><label>رقم عملية التحويل إن وجد</label><input id="paymentReference"></div><div class="field"><label>صورة إثبات التحويل</label><input id="paymentScreenshot" type="file" accept="image/png,image/jpeg,image/webp"></div><div class="field"><label>ملاحظة</label><textarea id="customerNote"></textarea></div><div class="row"><button class="btn" id="placeOrder">إرسال الطلب</button><button class="btn alt" id="checkoutClose">إلغاء</button></div></div></div>
<div class="modal hidden" id="ordersModal"><div class="panel orders"><h2>طلباتي</h2><div id="ordersList"></div><button class="btn alt" id="ordersClose">إغلاق</button></div></div>
<footer><div class="wrap">DigitalZone © 2026 — متجر رقمي مستقل.</div></footer>
<script>
const SUPABASE_URL="https://smwbaohdcacfzebcxmlc.supabase.co";
const SUPABASE_KEY="sb_publishable_1-KiFlUYGXKh-R6qNiPTeA_SHU8TzCd";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);let products=[],user=null,selected=null,activeCat="الكل",signup=false;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function art(name,cat){const seed=encodeURIComponent(name+"|"+cat);return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><rect width="900" height="600" rx="50" fill="#100918"/><circle cx="120" cy="80" r="190" fill="#a855f7" opacity=".18"/><circle cx="780" cy="540" r="230" fill="#ec4899" opacity=".12"/><rect x="95" y="95" width="710" height="410" rx="45" fill="url(#g)" opacity=".86"/><rect x="125" y="125" width="650" height="350" rx="35" fill="#120b1c" opacity=".78"/><text x="450" y="285" text-anchor="middle" font-family="Arial" font-size="48" font-weight="800" fill="#fff">${esc(name).slice(0,22)}</text><text x="450" y="350" text-anchor="middle" font-family="Arial" font-size="28" fill="#e9d5ff">${esc(cat).slice(0,28)}</text><text x="450" y="420" text-anchor="middle" font-family="Arial" font-size="22" fill="#f0abfc">DIGITALZONE</text></svg>`);}
async function load(){const {data,error}=await db.from("products").select("id,name,slug,category,description,price,compare_at_price,image_url,duration,is_active,stock_status").eq("is_active",true).order("category").order("name");if(error){$("catalog").innerHTML='<div class="empty">تعذر تحميل المنتجات.</div>';return}products=data||[];renderCats();render();}
function renderCats(){const cats=[...new Set(products.map(p=>p.category||"أخرى"))];$("cats").innerHTML='<button class="cat '+(activeCat==="الكل"?"active":"")+'" data-cat="الكل">الكل</button>'+cats.map(c=>'<button class="cat '+(activeCat===c?"active":"")+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join("");document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;renderCats();render()});}
function render(){const q=$("search").value.trim().toLowerCase();const list=products.filter(p=>(activeCat==="الكل"||p.category===activeCat)&&((p.name+" "+p.category+" "+(p.description||"")).toLowerCase().includes(q)));if(!list.length){$("catalog").innerHTML='<div class="empty">مفيش منتجات مطابقة حاليًا.</div>';return}const groups={};list.forEach(p=>(groups[p.category||"أخرى"]??=[]).push(p));$("catalog").innerHTML=Object.entries(groups).map(([cat,items])=>'<div class="section"><div class="section-head"><h2>'+esc(cat)+'</h2><span class="count">'+items.length+' منتج</span></div><div class="grid">'+items.map(card).join("")+'</div></div>').join("");document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>openCheckout(b.dataset.buy));}
function card(p){const img=p.image_url||art(p.name,p.category);return '<article class="card"><div class="art"><img src="'+img+'" alt="'+esc(p.name)+'"></div><div class="meta">'+esc(p.category||"منتجات")+'</div><h3>'+esc(p.name)+'</h3><div class="desc">'+esc(p.description||"منتج رقمي متاح للطلب.")+'</div><div class="price">'+Number(p.price).toLocaleString("ar-EG")+" ج.م</div><div class="row"><button class="btn" data-buy="'+p.id+'">اطلب الآن</button></div></article>'}
async function refresh(){const r=await db.auth.getUser();user=r.data.user||null;$("authBtn").textContent=user?"حسابي":"دخول"}
function msg(id,t,ok=false){$(id).innerHTML=t?'<div class="msg '+(ok?"ok":"err")+'">'+esc(t)+'</div>':""}
$("authBtn").onclick=async()=>{if(user){if(confirm("تسجيل الخروج؟")){await db.auth.signOut();await refresh()}}else{$("authModal").classList.remove("hidden")}};
$("authClose").onclick=()=>$("authModal").classList.add("hidden");$("authToggle").onclick=()=>{signup=!signup;$("authTitle").textContent=signup?"إنشاء حساب":"تسجيل الدخول";$("authSubmit").textContent=signup?"إنشاء الحساب":"دخول";$("authToggle").textContent=signup?"عندي حساب":"إنشاء حساب";$("nameWrap").style.display=signup?"block":"none";msg("authMsg","")};
$("authSubmit").onclick=async()=>{const email=$("email").value.trim(),password=$("password").value;if(password.length<8){msg("authMsg","كلمة المرور لازم تكون 8 أحرف على الأقل.");return}let r=signup?await db.auth.signUp({email,password,options:{data:{full_name:$("fullName").value.trim()}}}):await db.auth.signInWithPassword({email,password});if(r.error){msg("authMsg",r.error.message);return}await refresh();$("authModal").classList.add("hidden")};
$("googleBtn").onclick=async()=>{const {error}=await db.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin}});if(error)msg("authMsg",error.message)};
$("search").oninput=render;$("shopBtn").onclick=()=>$("products").scrollIntoView({behavior:"smooth"});
async function openCheckout(id){selected=products.find(p=>p.id===id);if(!selected)return;if(!user){$("authModal").classList.remove("hidden");return}$("checkoutProduct").innerHTML='<div class="msg ok"><b>'+esc(selected.name)+'</b> — '+Number(selected.price).toLocaleString("ar-EG")+' ج.م</div>';$("customerName").value=user.user_metadata?.full_name||"";$("checkoutModal").classList.remove("hidden")}
$("checkoutClose").onclick=()=>$("checkoutModal").classList.add("hidden");$("ordersClose").onclick=()=>$("ordersModal").classList.add("hidden");$("ordersBtn").onclick=async()=>{if(!user){$("authModal").classList.remove("hidden");return}await loadOrders();$("ordersModal").classList.remove("hidden")};
$("placeOrder").onclick=async()=>{if(!selected||!user)return;const f=$("paymentScreenshot").files?.[0];if(!f){msg("checkoutMsg","ارفع صورة إثبات التحويل.");return}if(f.size>5*1024*1024){msg("checkoutMsg","الصورة لازم تكون 5 ميجا أو أقل.");return}$("placeOrder").disabled=true;try{const ext=f.type.split("/")[1].replace("jpeg","jpg"),path=user.id+"/"+crypto.randomUUID()+"."+ext;const up=await db.storage.from("order-payment-proofs").upload(path,f,{contentType:f.type});if(up.error)throw up.error;const r=await db.functions.invoke("create-order",{body:{items:[{product_id:selected.id,quantity:1}],customer_name:$("customerName").value.trim(),customer_phone:$("customerPhone").value.trim()||null,sender_phone:$("senderPhone").value.trim(),payment_reference:$("paymentReference").value.trim()||null,payment_screenshot_path:path,delivery_method:$("deliveryMethod").value,delivery_destination:$("deliveryDestination").value.trim(),customer_note:$("customerNote").value.trim()||null}});if(r.error)throw r.error;$("checkoutModal").classList.add("hidden");alert("تم إرسال الطلب للمراجعة.");await loadOrders();$("ordersModal").classList.remove("hidden")}catch(e){msg("checkoutMsg","تعذر إرسال الطلب: "+(e.message||"خطأ"))}finally{$("placeOrder").disabled=false}};
async function loadOrders(){const r=await db.from("orders").select("order_number,total,payment_status,order_status,delivery_status,created_at").order("created_at",{ascending:false}).limit(30);if(r.error){$("ordersList").textContent="تعذر تحميل الطلبات.";return}$("ordersList").innerHTML=r.data?.length?r.data.map(o=>'<div class="order"><b>'+esc(o.order_number)+'</b><div>'+Number(o.total).toLocaleString("ar-EG")+' ج.م</div><div class="muted">الدفع: '+esc(o.payment_status)+' • الطلب: '+esc(o.order_status)+'</div><small class="muted">'+new Date(o.created_at).toLocaleString("ar-EG")+'</small></div>').join(""):"لسه مفيش طلبات."}
db.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh();load();
</script>
</body></html>
