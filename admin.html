<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DigitalZone Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#08060d;--panel:#120b19;--panel2:#1a1026;--line:#352046;--p:#a855f7;--pink:#f0abfc;--txt:#faf7ff;--muted:#b9a8c8;--ok:#4ade80;--bad:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#321548 0,#08060d 50%);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(1250px,94%);margin:auto}header{position:sticky;top:0;z-index:20;background:#09060ded;backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}.top{min-height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:950}.brand span{color:var(--pink)}button{border:0;cursor:pointer;border-radius:11px;padding:10px 14px;color:#fff;font-weight:800;background:linear-gradient(135deg,var(--p),#7c3aed)}button.alt{background:#1b1226;border:1px solid var(--line)}button.danger{background:#5f172b}.layout{display:grid;grid-template-columns:230px 1fr;gap:16px;padding:20px 0}.side,.panel,.stat,.product{background:linear-gradient(160deg,#181022,#0f0915);border:1px solid var(--line);border-radius:17px}.side{padding:12px;height:max-content;position:sticky;top:86px}.nav{display:block;width:100%;text-align:right;background:transparent;color:#dbc9e9;margin:4px 0}.nav.active{background:#5b21b6}.content{min-width:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:15px}.stat b{display:block;font-size:26px;margin-top:6px}.muted{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar input,.field input,.field textarea,.field select{background:#0b0710;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;width:100%}.toolbar input{flex:1;min-width:220px}.sections{display:grid;gap:18px}.section{padding:14px;background:#0d0812;border:1px solid var(--line);border-radius:18px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-head h2{margin:0;font-size:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px}.product{padding:10px;overflow:hidden}.product img{width:100%;height:145px;object-fit:cover;border-radius:12px;background:#160d20}.product h3{font-size:15px;margin:9px 0 4px}.product .price{font-size:19px;font-weight:950;margin:6px 0}.row{display:flex;gap:7px;flex-wrap:wrap}.row>*{flex:1}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#251635;color:#dfc8f0;font-size:11px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:14px;z-index:50}.modal.hidden{display:none}.modal .panel{width:min(620px,100%);max-height:92vh;overflow:auto;padding:18px}.field{margin:11px 0}.field label{display:block;margin-bottom:6px;color:#decce9;font-size:13px}.msg{padding:10px;border-radius:10px;background:#20142b;margin:10px 0}.msg.err{border:1px solid #7f1d32}.msg.ok{border:1px solid #166534}.order{padding:14px 0;border-bottom:1px solid var(--line)}.hidden{display:none!important}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;gap:6px;overflow:auto}.nav{white-space:nowrap;width:auto}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.product img{height:105px}.product{padding:8px}.product h3{font-size:13px}.stats{gap:7px}.stat{padding:10px}.stat b{font-size:21px}}
</style>
</head>
<body>
<header><div class="wrap top"><div class="brand">Digital<span>Zone</span> Admin</div><button class="alt" id="logout">خروج</button></div></header>
<main class="wrap layout"><aside class="side"><button class="nav active" data-view="catalog">📦 المنتجات</button><button class="nav" data-view="orders">🧾 الطلبات</button></aside><section class="content"><div id="loginBox" class="panel" style="padding:22px"><h2>دخول المدير</h2><div id="loginMsg"></div><div class="field"><label>البريد</label><input id="email" type="email"></div><div class="field"><label>كلمة المرور</label><input id="pass" type="password"></div><button id="login">دخول</button></div><div id="app" class="hidden"><div class="stats"><div class="stat"><span class="muted">كل المنتجات</span><b id="sAll">0</b></div><div class="stat"><span class="muted">منشور</span><b id="sPub">0</b></div><div class="stat"><span class="muted">مسودة</span><b id="sDraft">0</b></div><div class="stat"><span class="muted">طلبات معلقة</span><b id="sOrders">0</b></div></div><div id="catalogView"><div class="toolbar"><input id="q" placeholder="ابحث عن منتج أو قسم..."><button id="add">+ إضافة منتج</button></div><div id="sections" class="sections"></div></div><div id="ordersView" class="hidden"><div class="toolbar"><button id="reloadOrders">تحديث الطلبات</button></div><div class="panel" id="orders"></div></div></div></section></main>
<div class="modal hidden" id="productModal"><div class="panel"><h2 id="formTitle">إضافة منتج</h2><div id="formMsg"></div><div class="field"><label>اسم المنتج</label><input id="name"></div><div class="field"><label>القسم</label><select id="category"><option>اشتراكات رقمية</option><option>ألعاب وشحن</option><option>بطاقات رقمية</option><option>ذكاء اصطناعي</option><option>برامج وتصميم</option><option>ترفيه</option><option>أخرى</option></select></div><div class="field"><label>الوصف</label><textarea id="desc"></textarea></div><div class="field"><label>السعر</label><input id="price" type="number" min="0"></div><div class="field"><label>تكلفة المورد</label><input id="cost" type="number" min="0"></div><div class="field"><label>المدة</label><input id="duration" placeholder="مثال: شهر"></div><div class="field"><label>صورة المنتج</label><div id="preview"></div><small class="muted">لو مفيش صورة مرفوعة، النظام ينشئ تلقائيًا صورة موحدة من اسم المنتج والقسم.</small></div><div class="field"><label>الحالة</label><select id="stock"><option value="available">متاح</option><option value="limited">محدود</option><option value="unavailable">غير متاح</option></select></div><div class="row"><button id="save">حفظ</button><button class="alt" id="cancel">إلغاء</button></div></div></div>
<script>
const URL="https://smwbaohdcacfzebcxmlc.supabase.co",KEY="sb_publishable_1-KiFlUYGXKh-R6qNiPTeA_SHU8TzCd",db=supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);let user=null,isAdmin=false,items=[],editing=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function art(name,cat){return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><rect width="900" height="600" fill="#100918"/><circle cx="120" cy="100" r="210" fill="#a855f7" opacity=".2"/><circle cx="780" cy="500" r="220" fill="#ec4899" opacity=".13"/><rect x="90" y="90" width="720" height="420" rx="50" fill="url(#g)"/><rect x="125" y="125" width="650" height="350" rx="35" fill="#120b1c" opacity=".82"/><text x="450" y="285" text-anchor="middle" font-family="Arial" font-size="48" font-weight="800" fill="#fff">${esc(name).slice(0,22)}</text><text x="450" y="350" text-anchor="middle" font-family="Arial" font-size="28" fill="#e9d5ff">${esc(cat).slice(0,26)}</text><text x="450" y="420" text-anchor="middle" font-family="Arial" font-size="22" fill="#f0abfc">DIGITALZONE</text></svg>`)}
function notice(id,t,ok=false){$(id).innerHTML=t?'<div class="msg '+(ok?"ok":"err")+'">'+esc(t)+'</div>':""}
async function boot(){const r=await db.auth.getUser();user=r.data.user;if(!user){$("loginBox").classList.remove("hidden");return}const a=await db.from("admin_profiles").select("user_id,role").eq("user_id",user.id).maybeSingle();isAdmin=!!a.data;if(!isAdmin){notice("loginMsg","الحساب ده مش مضاف كمدير.");await db.auth.signOut();return}$("loginBox").classList.add("hidden");$("app").classList.remove("hidden");await loadProducts();await loadOrders()}
$("login").onclick=async()=>{const r=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("pass").value});if(r.error){notice("loginMsg",r.error.message);return}boot()};$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};
async function loadProducts(){const r=await db.from("products").select("id,name,slug,category,description,price,compare_at_price,image_url,duration,is_active,stock_status").order("category").order("name");if(r.error){notice("formMsg","تعذر تحميل المنتجات.");return}items=r.data||[];render();$("sAll").textContent=items.length;$("sPub").textContent=items.filter(x=>x.is_active).length;$("sDraft").textContent=items.filter(x=>!x.is_active).length}
function render(){const q=$("q").value.trim().toLowerCase();const list=items.filter(p=>(p.name+" "+p.category+" "+(p.description||"")).toLowerCase().includes(q));const groups={};list.forEach(p=>(groups[p.category||"أخرى"]??=[]).push(p));$("sections").innerHTML=Object.entries(groups).map(([cat,arr])=>'<section class="section"><div class="section-head"><h2>'+esc(cat)+'</h2><span class="muted">'+arr.length+' منتج</span></div><div class="grid">'+arr.map(p=>{const img=p.image_url||art(p.name,p.category);return '<article class="product"><img src="'+img+'" alt="'+esc(p.name)+'"><span class="badge">'+(p.is_active?"منشور":"مسودة")+'</span><h3>'+esc(p.name)+'</h3><div class="muted">'+esc(p.description||"بدون وصف")+'</div><div class="price">'+Number(p.price).toLocaleString("ar-EG")+" ج.م</div><div class="row"><button data-edit=""+p.id+"">تعديل</button><button class="alt" data-toggle=""+p.id+"">"+(p.is_active?"إخفاء":"نشر")+"</button></div></article>"}).join("")+'</div></section>').join("")||'<div class="panel">مفيش منتجات.</div>';document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openForm(b.dataset.edit));document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>toggle(b.dataset.toggle))}
$("q").oninput=render;
function openForm(id){editing=items.find(p=>p.id===id)||null;$("formTitle").textContent=editing?"تعديل المنتج":"إضافة منتج";$("name").value=editing?.name||"";$("category").value=editing?.category||"اشتراكات رقمية";$("desc").value=editing?.description||"";$("price").value=editing?.price||"";$("cost").value="";$("duration").value=editing?.duration||"";$("stock").value=editing?.stock_status||"available";$("preview").innerHTML='<img style="width:100%;height:170px;object-fit:cover;border-radius:12px" src="'+(editing?.image_url||art(editing?.name||"DigitalZone",editing?.category||"منتج رقمي"))+'">';$("productModal").classList.remove("hidden");if(editing)db.from("product_costs").select("supplier_cost").eq("product_id",editing.id).maybeSingle().then(r=>$("cost").value=r.data?.supplier_cost??"")}
$("add").onclick=()=>openForm(null);$("cancel").onclick=()=>$("productModal").classList.add("hidden");
$("save").onclick=async()=>{const name=$("name").value.trim();if(!name){notice("formMsg","اكتب اسم المنتج.");return}const category=$("category").value,slug=(name+"-"+crypto.randomUUID().slice(0,8)).toLowerCase().replace(/[^a-z0-9؀-ۿ]+/g,"-");const payload={name,slug:editing?.slug||slug,category,description:$("desc").value.trim(),price:Number($("price").value||0),duration:$("duration").value.trim()||null,stock_status:$("stock").value,image_url:editing?.image_url||art(name,category),is_active:editing?.is_active??false};let r;if(editing)r=await db.from("products").update(payload).eq("id",editing.id).select().single();else r=await db.from("products").insert(payload).select().single();if(r.error){notice("formMsg",r.error.message);return}const pid=r.data.id;const cost=Number($("cost").value||0);const cr=await db.from("product_costs").upsert({product_id:pid,supplier_cost:cost,updated_by:user.id});if(cr.error){notice("formMsg","تم حفظ المنتج لكن تعذر حفظ تكلفة المورد: "+cr.error.message);return}$("productModal").classList.add("hidden");await loadProducts()};
async function toggle(id){const p=items.find(x=>x.id===id);if(!p)return;const r=await db.from("products").update({is_active:!p.is_active}).eq("id",id);if(r.error){alert(r.error.message);return}await loadProducts()}
async function loadOrders(){const r=await db.from("orders").select("id,order_number,customer_name,customer_email,customer_phone,sender_phone,total,payment_status,order_status,payment_reference,payment_screenshot_path,delivery_method,delivery_destination,delivery_status,customer_note,created_at").order("created_at",{ascending:false}).limit(100);if(r.error){$("orders").textContent="تعذر تحميل الطلبات.";return}$("orders").innerHTML=r.data?.length?r.data.map(o=>'<div class="order"><b>'+esc(o.order_number)+' — '+Number(o.total).toLocaleString("ar-EG")+' ج.م</b><div>'+esc(o.customer_name)+' • '+esc(o.customer_email)+'</div><div class="muted">الدفع: '+esc(o.payment_status)+' • الطلب: '+esc(o.order_status)+'</div><div class="muted">التسليم: '+esc(o.delivery_method||"—")+' • '+esc(o.delivery_destination||"—")+'</div>'+(o.payment_screenshot_path?'<button class="alt" data-proof="'+esc(o.payment_screenshot_path)+'">صورة التحويل</button>':"")+'<div class="row" style="margin-top:8px"><button data-confirm="'+o.id+'">تأكيد الدفع</button><button class="danger" data-reject="'+o.id+'">رفض</button></div></div>').join(""):"لا توجد طلبات.";$("sOrders").textContent=(r.data||[]).filter(x=>x.payment_status==="pending_review").length;document.querySelectorAll("[data-proof]").forEach(b=>b.onclick=async()=>{const r=await db.storage.from("order-payment-proofs").createSignedUrl(b.dataset.proof,300);if(r.data?.signedUrl)window.open(r.data.signedUrl,"_blank")});document.querySelectorAll("[data-confirm]").forEach(b=>b.onclick=()=>review(b.dataset.confirm,"confirm"));document.querySelectorAll("[data-reject]").forEach(b=>b.onclick=()=>review(b.dataset.reject,"reject"))}
async function review(id,decision){if(!confirm(decision==="confirm"?"أكدت وصول التحويل؟":"رفض الطلب؟"))return;const r=await db.functions.invoke("review-payment",{body:{order_id:id,decision,admin_note:null}});if(r.error)alert(r.error.message);else await loadOrders()}
$("reloadOrders").onclick=loadOrders;document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));b.classList.add("active");$("catalogView").classList.toggle("hidden",b.dataset.view!=="catalog");$("ordersView").classList.toggle("hidden",b.dataset.view!=="orders")});db.auth.onAuthStateChange(()=>setTimeout(boot,0));boot();
</script>
</body></html>
